<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecciones - Hazle López</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #c0392b;
            --bg: #fdfbf7;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #fdfbf7 0%, #f5f0e1 100%);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient);
            color: var(--primary);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 4rem;
        }
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 0;
        }
        .back-link {
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            display: inline-block;
        }
        .entries-container {
            max-width: 800px;
            width: 100%;
            display: grid;
            gap: 2rem;
        }
        .blog-entry {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .blog-entry:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }
        .entry-content h2 {
            margin: 0;
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 600;
        }
        .entry-content p {
            margin: 0.5rem 0 0;
            color: #666;
            font-size: 1rem;
        }
        .entry-arrow {
            font-size: 2rem;
            color: var(--accent);
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .blog-entry:hover .entry-arrow {
            opacity: 1;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← Volver al inicio</a>
    <header>
        <h1>Mis Lecciones</h1>
        <p style="color: #7f8c8d; font-size: 1.1rem;">Selecciona un nivel para comenzar</p>
    </header>

    <div class="entries-container">
        <!-- FIRST LESSON ENTRY -->
        <a href="leccion-1/index.html" class="blog-entry">
            <div class="entry-content">
                <h2>Primera Lección</h2>
                <p>Números, Calendario, Días, Meses y Verbo Ser/Estar.</p>
            </div>
            <div class="entry-arrow">➜</div>
        </a>
        
        <!-- FUTURE ENTRIES PLACEHOLDER -->
        <div style="text-align: center; padding: 2rem; color: #bdc3c7; font-style: italic; border: 2px dashed #ecf0f1; border-radius: 24px;">
            Próximamente más lecciones...
        </div>
    </div>
</body>
</html>
